<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0c342b"/>
<title>高尔夫规则编号记忆助手 · 试玩版</title>
<style>
:root{--bg:#eff4ef;--green:#123f32;--green2:#1c5947;--mint:#dcece3;--gold:#e6b968;--text:#182a22;--muted:#5c7167;--red:#a04136}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text);background:var(--bg)}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:640px;margin:auto;padding:18px 16px 42px}.hero{background:linear-gradient(130deg,#123e30,#23644c);color:white;border-radius:24px;padding:24px 23px 26px;box-shadow:0 12px 30px #10392319}.eyebrow{font-size:12px;letter-spacing:2px;color:#bce2cd;font-weight:700}.hero h1{margin:14px 0 9px;font-size:28px;line-height:1.3}.hero p{color:#d6e8dd;font-size:14px;line-height:1.7;margin:0}.little{display:inline-flex;border-radius:40px;border:1px solid #ffffff45;padding:6px 10px;font-size:11px;margin-top:18px}.sectiontitle{font-size:15px;font-weight:750;margin:26px 0 12px}.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mode{border:1px solid #c7d7cb;background:white;border-radius:15px;text-align:left;padding:14px 10px;min-height:94px}.mode.active{background:var(--green);color:white;border-color:var(--green)}.mode strong{font-size:16px;display:block}.mode small{display:block;font-size:11px;line-height:1.5;margin-top:7px;color:inherit;opacity:.78}.panel{background:#fff;border:1px solid #e3e9e2;border-radius:22px;padding:22px 20px;margin-top:17px;box-shadow:0 6px 24px #204a2910}.paneltop{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{display:inline-block;background:#e9f3e9;color:#2c634e;border-radius:30px;padding:6px 10px;font-size:12px;font-weight:700}.counter{font-size:12px;color:var(--muted)}.prompt{font-size:22px;font-weight:750;line-height:1.58;margin:23px 0 20px;min-height:112px}.sub{font-size:13px;color:var(--muted);margin:0 0 12px}.choices{display:grid;gap:10px}.choice{width:100%;background:#f7faf7;border:1.5px solid #d9e4dc;border-radius:14px;padding:14px;text-align:left;color:var(--green);font-size:18px;font-weight:700}.choice:active{transform:scale(.995)}.choice:disabled{cursor:default;opacity:1}.choice.correct{background:#dcf2e6;border-color:#2b8c65}.choice.wrong{background:#fff0ee;border-color:#c3675a}.input{border-radius:13px;border:1.5px solid #bacfc2;width:100%;font-size:20px;padding:14px 15px;outline-color:#246647}.btn{background:var(--green);color:white;border:0;border-radius:13px;padding:14px 17px;font-weight:700;display:block;width:100%;margin-top:12px}.btn.secondary{background:#e5eee7;color:#184331}.btn:disabled{opacity:.48;cursor:default}.feedback{border-radius:14px;padding:15px;margin-top:17px;line-height:1.7;background:#eef6ef}.feedback.bad{background:#fff3ed}.feedback h3{font-size:16px;margin:0 0 5px}.feedback p{font-size:13px;margin:4px 0}.feedback a{color:#205b45;font-size:13px}.progress{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:21px 4px 0;color:#4b6256;font-size:13px}.bar{height:8px;border-radius:10px;background:#dce8dd;margin:9px 4px 0;overflow:hidden}.bar>div{height:100%;background:#2f7b5a;width:0%;transition:width .3s}.footer{font-size:12px;color:#66776b;line-height:1.7;margin:20px 5px 0}.footer a{color:#20563d}.reset{border:0;color:#35614e;background:none;padding:8px;font-size:12px}.hide{display:none!important}@media(max-width:380px){.hero h1{font-size:25px}.prompt{font-size:19px}.mode{padding:12px 8px}}
body{background:#f3f0e5}.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:18px 18px 4px 4px;background:#153d31;border-bottom:4px solid #bea565}.hero .course{position:absolute;right:-2%;bottom:0;width:55%;height:100%;z-index:-1}.hero p{max-width:60%}.hero h1{font-family:Georgia,"Songti SC",serif}.panel{border-radius:8px;border-top:4px solid #42684c}.mode{border-radius:8px}.counter{font-variant-numeric:tabular-nums}.input[aria-invalid=true]{border:2px solid #ae342c;outline-color:#ae342c;background:#fff8f5}.validation{background:#fff0e9;color:#922d23;border-left:3px solid #ae342c;padding:10px 12px;margin:8px 0 0;border-radius:4px;font-size:14px;animation:rise .22s ease-out}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.validation{animation:none}}</style>
</head>
<body><main class="wrap">
<header class="hero"><svg class="course" viewBox="0 0 240 200" preserveAspectRatio="xMaxYMax slice" aria-hidden="true"><rect width="240" height="200" fill="#153d31"/><path d="M5 200Q40 160 104 145T157 91Q152 66 205 49T250 13V200" fill="#284e39"/><path d="M38 200Q62 161 122 150T168 108Q144 80 207 65T250 35V200" fill="#406747"/><path d="M75 200Q89 176 143 159T188 113Q163 87 209 79T250 51V200" fill="#527a51"/><ellipse cx="183" cy="121" rx="39" ry="12" fill="#8da26b"/><path d="M183 121V65" stroke="#f6edd3" stroke-width="2"/><path d="M184 65l22 6-22 7" fill="#e9bd72"/><path d="M217 139q-8-7-18-3t-4 9q7 3 17-1t5-5" fill="#d2c095"/></svg><div class="eyebrow">GOLF RULES &nbsp; / &nbsp; PRACTICE GREEN</div><h1>高尔夫规则<br>编号记忆助手</h1><p>从球场情境出发，把规则内容与规则编号真正联系起来。</p><div class="little">交互试玩版 V0.3 · 6 道示例题</div></header>
<div class="sectiontitle">选择练习模式</div>
<div class="modes" role="group" aria-label="练习难度"><button class="mode active" data-level="1"><strong>入门</strong><small>三选一<br>认识规则号</small></button><button class="mode" data-level="2"><strong>挑战</strong><small>自主填写<br>无提示记忆</small></button></div>
<section class="panel" aria-live="polite"><div class="paneltop"><span class="tag" id="leveltag">入门练习</span><span class="counter" id="questionNum">第 1 / 6 题</span></div><div class="prompt" id="prompt"></div><div class="sub">请选择与情境最直接对应的规则编号。</div><div id="options" class="choices"></div><div id="writeArea" class="hide"><input id="answerInput" class="input" inputmode="text" autocomplete="off" spellcheck="false" placeholder="填写规则编号" aria-label="输入规则编号" aria-describedby="validation"/><p id="validation" class="validation" role="status" hidden></p><button class="btn" id="checkBtn">提交答案</button></div><div id="feedback" class="feedback hide"></div><button id="nextBtn" class="btn hide">下一道题 →</button></section>
<div class="progress"><span id="scoreLabel">本轮正确：0 题</span><span id="progressLabel">已完成 0 / 6</span></div><div class="bar"><div id="progressFill"></div></div><div style="text-align:right"><button class="reset" id="resetBtn">↻ 重新开始本轮练习</button></div>
<p class="footer">本网页是学习原型，不是官方裁判考试题库。题目为简化情境，遇到复杂情形应查阅完整规则、定义及委员会程序。依据：<a href="https://www.randa.org/rog/the-rules-of-golf" target="_blank" rel="noopener">The R&amp;A 高尔夫规则</a>。当前不需要注册账号，也不会上传答题数据。</p>
</main>
<script>
const questions=[
{q:'球员的球已经出界（OB），需要按杆数与距离补救。你会查哪条规则？',a:'18.2',choices:['17.1','18.2','19.2'],ex:'18.2 处理遗失球或界外球；通常须加一杆罚杆，并从上一杆位置重新打球。',url:'https://www.randa.org/rog/the-rules-of-golf/rule-18'},
{q:'球停在红色罚杆区内，球员决定加一杆罚杆，采取侧面补救。主要对应哪一条？',a:'17.1d(3)',choices:['17.1d(3)','16.1b','19.2c'],ex:'17.1d(3) 规定红色罚杆区的侧面补救选项；不是所有罚杆区都允许侧面补救。',url:'https://www.randa.org/rog/the-rules-of-golf/rule-17'},
{q:'球员认为普通区灌木丛中的球不可打，要选择一种不可打之球补救方式。主要依据哪条？',a:'19.2',choices:['19.2','18.3','15.2'],ex:'19.2 规定普通区或果岭上不可打之球的三种补救选项，通常各加一杆罚杆。',url:'https://www.randa.org/rog/the-rules-of-golf/rule-19'},
{q:'球员按照补救程序抛球，必须由球员本人从膝盖高度垂直抛下。正确抛球程序对应哪条？',a:'14.3b',choices:['14.3b','14.1a','13.1b'],ex:'14.3b 说明谁来抛球、从膝盖高度垂直抛球，以及有关补救区的要求。',url:'https://www.randa.org/rog/the-rules-of-golf/rule-14'},
{q:'球员的球在沙坑内被判为不可打，想加两杆罚杆到沙坑外采取后方线上补救。应查哪条？',a:'19.3b',choices:['19.3b','19.2c','17.2a'],ex:'19.3b 提供在沙坑外按后方线上补救的额外选择，须加两杆罚杆。',url:'https://www.randa.org/rog/the-rules-of-golf/rule-19'},
{q:'在果岭上球员想先拿起球，再放回原来的位置。拿球前应先标示球位。这个要求在哪条？',a:'14.1a',choices:['13.2a','14.1a','14.3b'],ex:'14.1a 规定当球被拿起、随后须放回原位时，应先标示球的位置。',url:'https://www.randa.org/rog/the-rules-of-golf/rule-14'}
];
let level=1,order=[],idx=0,correct=0,answered=false;
const el=id=>document.getElementById(id);
function scramble(){return [...questions.keys()].sort(()=>Math.random()-.5)}
function start(){order=scramble();idx=0;correct=0;answered=false;render()}
function render(){answered=false;clearError();const q=questions[order[idx]];el('prompt').textContent=q.q;el('questionNum').textContent=`第 ${idx+1} / ${questions.length} 题`;el('leveltag').textContent=['','入门练习','挑战练习'][level];el('scoreLabel').textContent=`本轮正确：${correct} 题`;el('progressLabel').textContent=`已完成 ${idx} / ${questions.length}`;el('progressFill').style.width=`${idx/questions.length*100}%`;el('feedback').classList.add('hide');el('nextBtn').classList.add('hide');el('writeArea').classList.toggle('hide',level===1);el('options').classList.toggle('hide',level!==1);el('answerInput').value='';el('answerInput').disabled=false;el('checkBtn').disabled=false;el('checkBtn').classList.remove('hide');el('options').innerHTML='';if(level===1){q.choices.forEach(choice=>{const b=document.createElement('button');b.className='choice';b.textContent=choice;b.onclick=()=>submit(choice,b);el('options').appendChild(b)})}document.querySelector('.sub').textContent=level===1?'请选择与情境最直接对应的规则编号。':'请输入完整规则编号。';}
function normalize(v){return v.normalize('NFKC').toLowerCase().replace(/\s+/g,'')}
function clearError(){el('validation').hidden=true;el('answerInput').removeAttribute('aria-invalid')}
function showError(message){el('validation').textContent=message;el('validation').hidden=false;el('answerInput').setAttribute('aria-invalid','true');el('answerInput').focus()}
function submit(value,button){if(answered)return;if(level===2){if(!value.trim()){showError('请先填写规则编号。');return}if(normalize(value)!==normalize(questions[order[idx]].a)){showError('编号还没答对，可以直接修改。');return}clearError()}answered=true;const q=questions[order[idx]],isRight=normalize(value.trim())===normalize(q.a);if(isRight)correct++;if(level===1){[...el('options').children].forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add('correct');else if(b===button)b.classList.add('wrong')})}else{el('answerInput').disabled=true;el('checkBtn').disabled=true;el('checkBtn').classList.add('hide');}
const feed=el('feedback');feed.className=`feedback${isRight?'':' bad'}`;feed.innerHTML=`<h3>${isRight?'✓ 回答正确！':'再记住这条规则'}</h3><p><b>正确编号：${q.a}</b></p><p>${q.ex}</p><a href="${q.url}" target="_blank" rel="noopener">查看 R&amp;A 对应原文 ↗</a>`;el('nextBtn').classList.remove('hide');el('nextBtn').textContent=idx===questions.length-1?'查看本轮结果 →':'下一道题 →';el('scoreLabel').textContent=`本轮正确：${correct} 题`;el('progressLabel').textContent=`已完成 ${idx+1} / ${questions.length}`;el('progressFill').style.width=`${(idx+1)/questions.length*100}%`}
function results(){el('questionNum').textContent='本轮结束';el('prompt').textContent=`你答对了 ${correct} / ${questions.length} 题`;el('options').classList.add('hide');el('writeArea').classList.add('hide');el('feedback').className='feedback';el('feedback').innerHTML='<h3>本轮完成 🎉</h3><p>理解情境后再记规则号，比死背编号更有帮助。你可以换一个难度再练一次。</p>';el('nextBtn').textContent='再练一轮 →';el('nextBtn').classList.remove('hide');el('nextBtn').onclick=()=>{el('nextBtn').onclick=next;start()};document.querySelector('.sub').textContent='';}
function next(){if(idx===questions.length-1)results();else{idx++;render()}}
el('answerInput').addEventListener('input',()=>{if(level===2&&!answered&&!el('validation').hidden&&normalize(el('answerInput').value)===normalize(questions[order[idx]].a))submit(el('answerInput').value)});
el('nextBtn').onclick=next;el('checkBtn').onclick=()=>submit(el('answerInput').value);el('answerInput').addEventListener('keydown',e=>{if(e.key==='Enter')submit(el('answerInput').value)});el('resetBtn').onclick=()=>{el('nextBtn').onclick=next;start()};document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{level=Number(b.dataset.level);document.querySelectorAll('.mode').forEach(c=>c.classList.toggle('active',c===b));el('nextBtn').onclick=next;start()}));start();
</script>
</body></html>
