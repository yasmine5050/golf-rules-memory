,"x":23,"y":73,"anchor":"灌木丛，想起 19。"},{"id":20,"place":"裁判车","name":"比赛中的规则问题","kw":"程序疑问 · 裁定","x":66,"y":80,"anchor":"裁判车，想起 20。"},{"id":21,"place":"积分榜","name":"其他个人比杆赛形式","kw":"积分 · 最高杆数","x":19,"y":27,"anchor":"积分榜，想起 21。"},{"id":22,"place":"交杆区","name":"四人二球赛（交替击球）","kw":"两人一球 · 交替击球","x":48,"y":20,"anchor":"交杆区，想起 22。"},{"id":23,"place":"双球位","name":"四球赛","kw":"各打各球 · 较低成绩","x":76,"y":36,"anchor":"双球位，想起 23。"},{"id":24,"place":"队旗","name":"团体赛","kw":"队伍 · 比赛条件","x":65,"y":74,"anchor":"队旗，想起 24。"},{"id":25,"place":"无障碍通道","name":"残障球员适用的调整","kw":"适用类别 · 辅助人员","x":23,"y":75,"anchor":"无障碍通道，想起 25。"}],"questions":[{"id":"09-kick","chapter":9,"rule":"9.4","scenario":"普通比杆赛。球道上的球已静止。球员走向球时意外踢动它，原位清楚，既非寻球也无其他免罚例外。哪条规则同时处理放回与罚杆？","options":["9.4","9.3","9.6"],"explanation":"球员自己造成球移动，依 9.4a 放回原位，依 9.4b 罚一杆。风和观众分别属于不同成因。","accepted":["9.4"],"memoryHint":"球动了，想起 9。","sourceUrl":"https://www.randa.org/rog/the-rules-of-golf/rule-9","verificationStatus":"已对照 R&A 英文规则；中文题解为学习摘要","probe":"球员在普通区准备挥杆前不慎踩到自己已静止的球，球向前滚动数厘米。原位能确定，不属于搜寻或其他免罚情形。应依据哪一具体规则处理罚杆与放回？"},{"id":"09-wind","chapter":9,"rule":"9.3","scenario":"球员上一杆打出的球已在球道停稳，尚未上杆，一阵风把球吹到另一处球道。球此前没有被抛、放或放回。按哪条规则继续？","options":["9.3","9.4","9.6"],"explanation":"风是自然力，本题没有适用的例外。不罚杆，从风吹至的新位置打。","accepted":["9.3"],"memoryHint":"球动了，想起 9。","sourceUrl":"https://www.randa.org/rog/the-rules-of-golf/rule-9","verificationStatus":"已对照 R&A 英文规则；中文题解为学习摘要","probe":"前一杆把球打到球道，球完全停稳后，突然一阵强风使球滚向旁边。球从未被放回原位。球员应根据哪条规则确定接下来球的位置？"},{"id":"09-fan","chapter":9,"rule":"9.6","scenario":"观众捡起球道上静止的使用中球。裁判目睹全过程，原位清楚且球位状态未变。应查哪条规则？","options":["9.6","9.4","9.5"],"explanation":"观众是外来影响。球员不受罚，应把原球放回观众拿球前的位置。","accepted":["9.6"],"memoryHint":"球动了，想起 9。","sourceUrl":"https://www.randa.org/rog/the-rules-of-golf/rule-9","verificationStatus":"已对照 R&A 英文规则；中文题解为学习摘要","probe":"比赛时，一名不属于球员一方的路人把静止在长草内的使用中球捡起来交给裁判，原位置可确定。应按哪条规则继续？"},{"id":"13-shoe","chapter":13,"rule":"13.1d(1)","scenario":"本洞果岭上，球员走过球旁时意外用鞋碰动静止的球，原位清楚，尚未上杆。哪条规定免罚并放回？","options":["13.1d(1)","9.4b","13.1d(2)"],"explanation":"在果岭上意外导致球移动，按果岭专门规则免罚，将球放回原位。这里的原因是人意外碰动。","accepted":["13.1d(1)","13.1d"],"memoryHint":"走上果岭，想起 13。","sourceUrl":"https://www.randa.org/rog/the-rules-of-golf/rule-13","verificationStatus":"已对照 R&A 英文规则；中文题解为学习摘要","probe":"推杆前，球员的鞋子无意间碰到本洞果岭上已静止的球。没有其他人参与，原位清晰。依据哪项果岭特别规定？"},{"id":"13-wind","chapter":13,"rule":"13.1d(2)","scenario":"本洞果岭上，球已被标记、拿起并放回。球员尚未上杆，风将球吹离放回点。哪条规定决定下一杆的位置？","options":["13.1d(2)","13.1d(1)","9.6"],"explanation":"果岭球此前已放回，后来被自然力移动，必须放回刚才的位置，不罚杆。若此前未被拿起并放回，通常从新位置打。","accepted":["13.1d(2)","13.1d"],"memoryHint":"走上果岭，想起 13。","sourceUrl":"https://www.randa.org/rog/the-rules-of-golf/rule-13","verificationStatus":"已对照 R&A 英文规则；中文题解为学习摘要","probe":"果岭上的球已经被标记、拿起、放回。球员收起球标后，风又把球吹离该位置。此时应适用哪一具体条款？"},{"id":"14-high","chapter":14,"rule":"14.3b(4)","scenario":"合法补救区已确定。不适用规则25调整。球员从肩高抛球，球停在区内，尚未击打。要求纠正这个动作的具体条款是什么？","options":["14.3b(4)","14.3c(2)","14.2e"],"explanation":"错在抛球方式。须由本人从膝高重新正确抛球，击球前纠正不另罚。此次不计入两次正确抛球的次数。","accepted":["14.3b(4)","14.3b"],"memoryHint":"拿起、放回、抛球，想起 14。","sourceUrl":"https://www.randa.org/rog/the-rules-of-golf/rule-14","verificationStatus":"已对照 R&A 英文规则；中文题解为学习摘要","probe":"球员根据规则获得补救后，在指定的补救区内从胸口高度将球抛下，球停在区内。尚未击球且无规则25例外。依据哪一条款纠正？"},{"id":"14-roll","chapter":14,"rule":"14.3c(2)","scenario":"在普通区取侧面补救。球员两次均以正确方式抛球，球都先落在补救区内再滚出，无人干预。接下来依哪条程序？","options":["14.3c(2)","14.3b(4)","14.2c"],"explanation":"两次正确抛球均停在区外，应将球放在第二次抛球首先触地的点。此题先判断抛球方式正确，再判断停球处。","accepted":["14.3c(2)","14.3c"],"memoryHint":"拿起、放回、抛球，想起 14。","sourceUrl":"https://www.randa.org/rog/the-rules-of-golf/rule-14","verificationStatus":"已对照 R&A 英文规则；中文题解为学习摘要","probe":"球员取合法补救，两次按规定从膝高抛球，两次都先落入补救区却滚出区外，没有受到外部影响。接下来应遵循哪一程序条款？"},{"id":"17-side","chapter":17,"rule":"17.1d(3)","scenario":"球在红色罚杆区，最后越界点P已确定。球员选择以P为基准的侧面补救，不适用特殊调整或当地规则。哪条规定该选项？","options":["17.1d(3)","17.1d(2)","19.2c"],"explanation":"加一杆，以P为基准，在两支球杆长度内、不更近洞且在同一罚杆区外的合法补救区抛球，球须停在区内。","accepted":["17.1d(3)"],"memoryHint":"进入罚杆区，想起 17。","sourceUrl":"https://www.randa.org/rog/the-rules- const DAY=86400000,el=id=>document.getElementById(id);

const fresh=()=>({version:3,explored:false,seen:[],completed:[],legacyCompleted:[],mistakes:{},answers:[],dueAt:{},spacedLevel:{},firstFlow:[],createdAt:Date.now()});
function load(){
 try{
  const newer=JSON.parse(localStorage.getItem(STORE)||'null');if(newer)return Object.assign(fresh(),newer);
  const v2=JSON.parse(localStorage.getItem(OLD2)||'null');if(v2){
   const s=Object.assign(fresh(),{explored:!!v2.explored,seen:v2.seen||[],completed:v2.completed||[],legacyCompleted:v2.legacyCompleted||[],mistakes:v2.mistakes||{},answers:v2.answers||[],firstFlow:v2.firstFlow||[]});
   for(const q of questions){const a=s.answers.filter(t=>t.id===q.id&&t.correct).at(-1);if(a){const exposure=Math.max(a.at||0,v2.exposure?.[q.chapter]||0);s.dueAt[q.id]=exposure+DAY}}
   return s;
  }
  const v1=JSON.parse(localStorage.getItem(OLD1)||'null');if(v1){const s=fresh();s.explored=!!(v1.visited?.length);s.seen=(v1.visited||[]).filter(n=>chapters.some(c=>c.id===n));s.legacyCompleted=(v1.completed||[]).filter(n=>chapters.some(c=>c.id===n));for(const [id,m] of Object.entries(v1.mistakes||{}))if(byId.has(id))s.mistakes[id]={count:m.count||1,at:m.at||0,mastered:!!m.mastered,legacy:true};return s}
 }catch(e){el('storage-note').textContent='当前无法读取旧记录，可继续在本页练习。'}return fresh();
}
let state=load(),screen=state.explored?'map':'welcome',zone=0,current=null,studyStep=0,mode='challenge',quiz=null,lastResult=null;

function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){el('storage-note').textContent='本浏览器暂未保存进度；当前练习仍可继续。'}}

function drawMap(zoneNum,interactive=false){
 const w=create('div','map-art');w.innerHTML=TERRAIN;w.querySelectorAll('[data-landscape]').forEach(g=>{g.style.display=Number(g.getAttribute('data-landscape'))===zoneNum?'inline':'none'});
 if(interactive){const pins=create('div','map-pins');w.append(pins);for(const c of chapters.filter(x=>Math.floor((x.id-1)/5)===zoneNum)){
  const b=button(String(c.id).padStart(2,'0'),()=>openStation(c.id),'pin'+(state.completed.includes(c.id)?' done':state.seen.includes(c.id)?' seen':'')+(hasMistakes(c.id)?' due':''));
  b.style.left=c.x+'%';b.style.top=c.y+'%';b.setAttribute('aria-label',`规则 ${c.id}，${c.place}，${stationStatus(c.id)}`);b.title=`规则 ${c.id} · ${c.place}`;pins.append(b);
 }}return w;
}
function hasMistakes(ch){return Object.entries(state.mistakes).some(([id,m])=>!m.mastered&&byId.get(id)?.chapter===ch)}
function stationStatus(id){return hasMistakes(id)?'待复习':state.completed.includes(id)?'已完成':state.seen.includes(id)?'已探索':state.legacyCompleted.includes(id)?'旧版练过':'未探索'}
function dueQuestions(){return questions.filter(q=>hasPassed(q.id)&&state.dueAt[q.id]&&Date.now()>=state.dueAt[q.id]).sort((a,b)=>state.dueAt[a.id]-state.dueAt[b.id])}
function hasPassed(id){return state.answers.some(a=>a.id===id&&a.correct)||state.completed.includes(byId.get(id)?.chapter)}
function nextLearningQuestion(ch){const pool=questions.filter(q=>q.chapter===ch);return pool.find(q=>!state.answers.some(a=>a.id===q.id&&a.correct))||pool[(state.answers.filter(a=>pool.some(q=>q.id===a.id)&&a.from==='learn').length)%pool.length]}
function openStation(id){current=chapters.find(c=>c.id===id);if(!current)return;zone=Math.floor((id-1)/5);studyStep=0;if(!state.seen.includes(id))state.seen.push(id);markStep('select');save();page('study')}

}
function right(q,response){if(q.groups){const parts=canon(response).split('+').filter(Boolean);return parts.length===q.groups.length&&q.groups.every(g=>g.some(v=>parts.includes(canon(v))))}if(q.reverse)return response.trim()===String(q.answer).trim();return [q.rule,...(q.accepted||[])].some(v=>canon(v)===canon(response))}
function submit(){if(!quiz||quiz.submitted)return;const input=el('app').querySelector('input');const response=(input?input.value:quiz.choice).trim();if(!response){el('err').textContent=input?'请填写完整规则编号，再提交。':'先选择一个答案。';input?.focus();return}
 const q=quiz.q,ok=right(q,response),now=Date.now();quiz.submitted=true;
 const a={id:q.id,chapter:q.chapter,at:now,correct:ok,response:response,kind:quiz.mode,from:quiz.from,firstForMode:!state.answers.some(a=>a.id===q.id&&a.kind===quiz.mode&&a.from===quiz.from)};
 state.answers.push(a);
 if(ok){if(quiz.mode!=='reverse'&&quiz.mode!=='case'&&!state.completed.includes(q.chapter))state.completed.push(q.chapter);
  if(quiz.from==='review'||quiz.mode==='delay'){if(state.mistakes[q.id])state.mistakes[q.id].mastered=true}
 }else{const m=state.mistakes[q.id]||{count:0};state.mistakes[q.id]={count:m.count+1,at:now,mastered:false,legacy:false}}
 if(quiz.mode==='delay'){const level=ok?Math.min(2,(state.spacedLevel[q.id]||0)+1):0;state.spacedLevel[q.id]=level;state.dueAt[q.id]=now+(ok?(level===1?3*DAY:7*DAY):DAY)}
 else if(hasPassed(q.id)||ok)state.dueAt[q.id]=now+DAY;
 lastResult={q,ok,response,kind:quiz.mode,from:quiz.from};markStep('answer');markStep('feedback');save();page('feedback');
}
function feedback(root){
 const {q,ok,response}=lastResult,box=create('section','panel lesson-width');box.append(create('div','eyebrow','04 / FEEDBACK · 即时反馈'));
 box.append(create('h2','',ok?'这次判断正确':'这道题需要再巩固'));
 const result=create('div','result'+(ok?'':' wrong'));
 result.append(create('div','result-head',ok?'✓ 记住了正确的对应关系':'↺ 先找出混淆的地方'));
 result.append(create('div','result-number',esc(q.rule)));
 result.append(create('p','',`<strong>规则编号：</strong>${esc(q.rule)}。${esc(q.explanation)}`));
 if(!ok)result.append(create('div','pair',`<strong>你的答案</strong><p>${esc(response)}</p><p class="small" style="margin-top:9px">已加入错题集。立即重练只算纠正练习，隔日再记住才更有说服力。</p>`));
 result.append(create('div','pair',`<strong>空间记忆线索</strong><p>${esc(q.memoryHint||'回到对应球场位置，回忆该规则的判断条件')}</p>`));
 result.append(create('p','detail-line',`<a href="${esc(q.sourceUrl)}" target="_blank" rel="noopener noreferrer">核对 The R&A 规则原文 ↗</a>`));box.append(result);
 if(ok){box.append(create('p','muted',lastResult.kind==='basic'?'三选一正确已记录。无提示填写正确率与隔日正确率将另外计算。':'本次独立作答已记录；隔日测试会使用另一种情境。'))}else{box.append(create('p','muted','要先关掉解析再答，还是稍后回错题集巩固？'))}
 const actions=create('div','actions');if(!ok)actions.append(button('盖住解析，立即再试一次',()=>begin(q,q.reverse?'reverse':q.groups?'case':'challenge','retry')));
 actions.append(button('选择下一步 →',()=>page('loop'),ok?'btn primary':'btn secondary'));box.append(actions);root.append(box);
}
function loop(root){markStep('loop');save();const box=create('section','panel lesson-width');box.append(create('div','eyebrow','05 / LEARNING LOOP'));box.append(create('h2','','继续探索，还是巩固记忆？'));
 box.append(create('p','loop-summary',lastResult?.ok?'这道题已经完成一次正确回忆。':'这道题已进入错题集；你可以现在继续学，也可以稍后重练。'));
 const next=chapters.find(c=>!state.completed.includes(c.id)&&c.id!==lastResult?.q.chapter)||chapters.find(c=>c.id===((lastResult?.q.chapter||1)%25)+1)||chapters[0];
 const a=create('div','actions');a.append(button(`下一站 · ${next.place} →`,()=>openStation(next.id)));
 a.append(button(`复习错题（${Object.values(state.mistakes).filter(m=>!m.mastered).length}）`,()=>page('review'),'btn secondary'));
 a.append(button(`延迟记忆测试（${dueQuestions().length} 题待测）`,()=>page('delay'),'btn secondary'));
 a.append(button('返回球场，自由选择',()=>page('map'),'btn plain'));box.append(a);root.append(box);
}
function review(root){
 const items=Object.entries(state.mistakes).filter(([id,m])=>byId.has(id)&&!m.mastered).sort((a,b)=>b[1].at-a[1].at);
 const box=create('section','panel lesson-width');box.append(create('div','eyebrow','MISTAKE REVIEW · 错题复习'));box.append(create('h2','','重新独立判断'));box.append(create('p','muted space','重测前不展示正确编号、曾经填写的答案或解析。即刻重试的结果不会当作首次记忆效果。'));
 if(!items.length)box.append(create('div','empty space','目前没有待复习错题。可以回地图继续探索。'));
 else for(let i=0;i<items.length;i++){const [id,m]=items[i],q=byId.get(id);const card=create('article','item-review',`<h3>待复习情境 ${i+1}</h3><p>${esc(q.scenario)}</p><p class="small">答错记录：${m.count} 次</p>`);card.append(button('无提示重新作答 →',()=>begin(q,q.reverse?'reverse':q.groups?'case':'challenge','review'),'btn secondary'));box.append(card)}
 const actions=create('div','actions');actions.append(button('返回球场地图',()=>page('map')));box.append(actions);root.append(box);
}
function delayHub(root){
 const due=dueQuestions();const box=create('section','panel lesson-width');box.append(create('div','eyebrow','DELAYED RECALL · 延迟记忆测试'));box.append(create('h2','','隔一段时间，还记得吗？'));
 box.append(create('p','muted space','首次正确作答后至少间隔 24 小时，用不同措辞的情境无提示填写。再次正确将安排更长间隔；这里只衡量回忆，不衡量点击次数。'));
 if(due.length){const q=due[0];box.append(create('div','context',`<strong>待测试 ${due.length} 题</strong><p>本次不预览规则编号和地图位置。点击开始后，独立填写答案。</p>`));const a=create('div','actions');a.append(button('开始独立回忆 →',()=>begin(q,'delay','delay')));box.append(a)}
 else{const next=Object.entries(state.dueAt).map(([,t])=>t).filter(t=>Number.isFinite(t)&&t>Date.now()).sort((a,b)=>a-b)[0];box.append(create('div','empty space',next?`当前没有到期题目。最近一次可测时间：${new Date(next).toLocaleString('zh-CN')}。`:'目前没有到期题目。先完成任意一个站点的正确作答，24 小时后再检验。'))}
 const back=create('div','actions');back.append(button('返回球场，继续探索',()=>page('map'),'btn secondary'));box.append(back);root.append(box);
}
function records(root){
 const challenge=state.answers.filter(a=>a.kind==='challenge'&&a.from==='learn');const firstChallenge=[...new Map(challenge.map(a=>[a.id,challenge.find(v=>v.id===a.id)])).values()];
 const delayed=state.answers.filter(a=>a.kind==='delay');const firstDelayed=[...new Map(delayed.map(a=>[a.id,delayed.find(v=>v.id===a.id)])).values()];
 const wrongIds=new Set(state.answers.filter(a=>!a.correct).map(a=>a.id));const reviewed=state.answers.filter(a=>a.from==='review'&&a.kind==='challenge'&&wrongIds.has(a.id));const reviewSample=[...new Map(reviewed.map(a=>[a.id,reviewed.find(v=>v.id===a.id)])).values()];
 const mixup=firstChallenge.filter(a=>!a.correct&&questions.some(q=>q.chapter===a.chapter&&q.id!==a.id&&canon(q.rule)===canon(a.response||'')));const laterDelayed=delayed.filter(a=>firstDelayed.some(v=>v.id===a.id&&v.at<a.at));
 const score=a=>a.length?`${a.filter(x=>x.correct).length}/${a.length}`:'—';const box=create('section','panel lesson-width');box.append(create('div','eyebrow','LEARNING OUTCOMES · 学习结果'));box.append(create('h2','','看回忆是否真的改善'));box.append(create('p','muted space','分开记录首次挑战、错题独立重练和隔日新情境。即时纠正不会被计入首次正确率。'));
 box.append(create('div','metrics',`<div class="metric"><b>${state.firstFlow.includes('loop')?'已完成':'进行中'}</b><small>首次学习闭环</small></div><div class="metric"><b>${score(firstChallenge)}</b><small>挑战模式首次无提示正确</small></div><div class="metric"><b>${score(reviewSample)}</b><small>错题独立重练首次正确</small></div><div class="metric"><b>${mixup.length}/${firstChallenge.length||0}</b><small>同章规则编号混淆（越低越好）</small></div><div class="metric"><b>${score(firstDelayed)}</b><small>至少隔 24 小时首次回忆正确</small></div><div class="metric"><b>${score(laterDelayed)}</b><small>后续更长间隔回忆正确</small></div>`));
 box.append(create('p','info-slim','这些指标只反映本浏览器中的练习记录，不代表已经验证了真实学习效果。要判断是否优于传统背诵，还需要邀请实际用户进行对照测试。'));
 const a=create('div','actions');a.append(button('返回球场地图',()=>page('map')));a.append(button('清空本地学习记录',()=>{if(!confirm('确认清除本浏览器中的学习进度、错题和答题记录？不可撤销。'))return;try{localStorage.removeItem(STORE);localStorage.removeItem(OLD2);localStorage.removeItem(OLD1)}catch(e){}state=fresh();current=null;zone=0;page('welcome')},'btn plain'));box.append(a);root.append(box);
}
el('back').addEventListener('click',()=>page(screen==='feedback'?'loop':'map'));
window.addEventListener('storage',e=>{if([STORE,OLD2,OLD1].includes(e.key)){state=load();if(['map','review','records','delay'].includes(screen))page(screen)}});
page(screen);

</script></body></html>
