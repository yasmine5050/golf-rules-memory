<script>

const chapters=[
 {id:9,name:'静止球移动',anchor:'球动了，想起 9。',x:34,y:72,story:'球道上，球离开了压痕。裁判先停下来问：是谁，或者是什么，让它动了？'},
 {id:13,name:'果岭',anchor:'走上果岭，想起 13。',x:65,y:17,story:'走近旗杆，鞋尖轻轻擦过球。把这一幕记在果岭上，再判断它该回到哪里。'},
 {id:14,name:'规则操作程序',anchor:'拿起、放回、抛球，想起 14。',x:53,y:42,story:'裁判站在补救区旁，看两件事：球是怎么抛的，最后又停在哪里？'},
 {id:17,name:'罚杆区',anchor:'进入罚杆区，想起 17。',x:78,y:49,story:'池边一排红桩。先找球最后越过边界的点，再决定可以在哪里补救。'},
 {id:18,name:'遗失球与界外球',anchor:'球丢了或界外，想起 18。',x:24,y:18,story:'白桩旁，大家分头进树林找球。回想开球时，球员有没有先声明打暂定球？'}
];
const official=n=>'https://www.randa.org/rog/the-rules-of-golf/rule-'+n;
function item(id,chapter,rule,scenario,alternatives,explanation,accepted=[]){
 return {id,chapter,rule,scenario,options:[rule,...alternatives],explanation,accepted:[rule,...accepted],memoryHint:chapters.find(c=>c.id===chapter).anchor,sourceUrl:official(chapter),verificationStatus:'已对照 R&A 英文规则；中文题解为学习摘要'};
}
const questions=[
 item('09-kick',9,'9.4','普通比杆赛。球道上的球已静止。球员走向球时意外踢动它，原位清楚，既非寻球也无其他免罚例外。哪条规则同时处理放回与罚杆？',['9.3','9.6'],'球员自己造成球移动，依 9.4a 放回原位，依 9.4b 罚一杆。风和观众分别属于不同成因。'),
 item('09-wind',9,'9.3','球员上一杆打出的球已在球道停稳，尚未上杆，一阵风把球吹到另一处球道。球此前没有被抛、放或放回。按哪条规则继续？',['9.4','9.6'],'风是自然力，本题没有适用的例外。不罚杆，从风吹至的新位置打。'),
 item('09-fan',9,'9.6','观众捡起球道上静止的使用中球。裁判目睹全过程，原位清楚且球位状态未变。应查哪条规则？',['9.4','9.5'],'观众是外来影响。球员不受罚，应把原球放回观众拿球前的位置。'),
 item('13-shoe',13,'13.1d(1)','本洞果岭上，球员走过球旁时意外用鞋碰动静止的球，原位清楚，尚未上杆。哪条规定免罚并放回？',['9.4b','13.1d(2)'],'在果岭上意外导致球移动，按果岭专门规则免罚，将球放回原位。这里的原因是人意外碰动。',['13.1d']),
 item('13-wind',13,'13.1d(2)','本洞果岭上，球已被标记、拿起并放回。球员尚未上杆，风将球吹离放回点。哪条规定决定下一杆的位置？',['13.1d(1)','9.6'],'果岭球此前已放回，后来被自然力移动，必须放回刚才的位置，不罚杆。若此前未被拿起并放回，通常从新位置打。',['13.1d']),
 item('14-high',14,'14.3b(4)','合法补救区已确定。不适用规则25调整。球员从肩高抛球，球停在区内，尚未击打。要求纠正这个动作的具体条款是什么？',['14.3c(2)','14.2e'],'错在抛球方式。须由本人从膝高重新正确抛球，击球前纠正不另罚。此次不计入两次正确抛球的次数。',['14.3b']),
 item('14-roll',14,'14.3c(2)','在普通区取侧面补救。球员两次均以正确方式抛球，球都先落在补救区内再滚出，无人干预。接下来依哪条程序？',['14.3b(4)','14.2c'],'两次正确抛球均停在区外，应将球放在第二次抛球首先触地的点。此题先判断抛球方式正确，再判断停球处。',['14.3c']),
 item('17-side',17,'17.1d(3)','球在红色罚杆区，最后越界点P已确定。球员选择以P为基准的侧面补救，不适用特殊调整或当地规则。哪条规定该选项？',['17.1d(2)','19.2c'],'加一杆，以P为基准，在两支球杆长度内、不更近洞且在同一罚杆区外的合法补救区抛球，球须停在区内。'),
 item('17-line',17,'17.1d(2)','球在黄色罚杆区。球员选择区外后方线上补救，让最后越界点保持在洞与抛球点之间。哪一项规定这种选择？',['17.1d(1)','17.1d(3)'],'加一杆，在同一罚杆区外沿线向后抛球，首先触地处确定一支球杆长度的补救区。不能比越界点更近洞，还须符合球场区域限制。'),
 item('18-lost',18,'18.2a(1)','原球可能在普通区长草中。球员与球童同时开始寻找，连续三分钟仍未找到球，也无须识别的候选球。哪条定义这颗球何时成为遗失球？',['18.2b','18.3a'],'三分钟从球员或其球童开始寻找时起算。此处问遗失的认定，确认后怎样补救是下一步。',['18.2a']),
 item('18-ob',18,'18.2b','开球完全越过球场边界并确认界外。没有暂定球，也未采用界外替代补救当地规则。哪条要求球员回到发球区重打并加罚？',['18.2a','17.1d(1)'],'已确认出界，按杆数与距离补救加一杆。原开球计一杆，回发球区打的是第三杆。'),
 item('18-prov',18,'18.3b','球可能遗失在罚杆区外。打第二颗球之前，同组球员就在旁边。球员想让第二颗球取得暂定球身份。哪条规定应怎样声明？',['18.3a','18.3c'],'击球前向他人用“暂定球”或其他能明确表达该意思的话声明。仅说“我再打一颗”不足以表明暂定球身份。')
];

// 每站的反向回忆题也有独立 ID，以便错题集记录回忆方向。
const reverseScenes={
 9:'在普通区行走时踢动自己的静止球，不涉及免罚例外。',
 13:'在本洞果岭上，球员意外用鞋碰动自己的静止球。',
 14:'补救时从肩高抛球，尚未击打便发现抛球方式错误。',
 17:'球进入红色罚杆区，球员选择在最后越界点侧面补救。',
 18:'在普通区长草连续找球三分钟仍未发现球，要判定是否遗失。'
};
const reverse=chapters.map(c=>{
 const own=questions.find(q=>q.chapter===c.id);
 const other=chapters.filter(x=>x.id!==c.id).slice(0,2).map(x=>reverseScenes[x.id]);
 return {...own,id:'reverse-'+c.id,reverse:true,scenario:'看到 '+own.rule+'，下面哪一幕最直接对应这条规则？',answer:reverseScenes[c.id],options:[reverseScenes[c.id],...other]};
});
const challengeCases=[
 {id:'case-water',chapter:17,rule:'17.1d(3) + 14.3b(4)',groups:[['17.1d(3)'],['14.3b','14.3b(4)']],scenario:'普通比杆赛。第二杆进入红色罚杆区，最后越界点明确。球员选择侧面补救，在正确范围内从肩高抛球，球停在区内，尚未击打。本题不适用规则25调整。分别写出侧面补救及错误抛球纠正的依据，并判断下一杆是第几杆。',explanation:'红区侧面补救加一杆，以最后越界点为基准确定合法补救区。肩高抛球须由本人从膝高重新正确抛球，错误抛球不计入两次正确抛球。击球前纠正不另罚。已打两杆，加罚一杆，下一杆是第四杆。',extra:14},
 {id:'case-move',chapter:9,rule:'9.3 + 9.6',groups:[['9.3'],['9.6']],scenario:'比杆赛中，上一杆打出的球在球道A点停稳，此前未被抛、放或放回。上杆前，风把球吹到球道B点，随后观众从B点捡起球。裁判看清全过程，球位状态未变。分别写出两次移动的依据，并判断在哪里、用什么方式继续。',explanation:'风属于自然力，第一次移动后应从B点继续，不罚杆。观众属于外来影响，第二次移动后应把原球放回B点，仍不罚杆。B是观众捡球前的位置。'}
].map(q=>({...q,memoryHint:chapters.find(c=>c.id===q.chapter).anchor,sourceUrl:official(q.chapter),verificationStatus:'已对照 R&A 英文规则；中文题解为学习摘要'}));
const catalog=new Map([...questions,...reverse,...challengeCases].map(q=>[q.id,q]));
const key='golf-memory-map-v1';
const empty=()=>({visited:[],completed:[],mistakes:{}});
const $=id=>document.getElementById(id);
let state=empty(),station=null,round=null;
function readState(){
 try{
  const raw=JSON.parse(localStorage.getItem(key)||'null');
  if(!raw)return empty();
  const ids=chapters.map(c=>c.id);
  return {visited:ids.filter(i=>raw.visited?.includes(i)),completed:ids.filter(i=>raw.completed?.includes(i)),mistakes:Object.fromEntries(Object.entries(raw.mistakes||{}).filter(([id,r])=>catalog.has(id)&&r&&typeof r==='object'))};
 }catch{ $('storeNote').textContent='当前无法读取学习记录，本次仍可练习。';return empty();}
}
state=readState();
function persist(){try{localStorage.setItem(key,JSON.stringify(state))}catch{$('storeNote').textContent='浏览器未能保存记录，本次会话仍可使用。'}}
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
function button(text,fn,cls){const b=node('button',text,cls);b.onclick=fn;return b}
function source(n){const a=node('a','R&A 官方规则 '+n+' ↗');a.href=official(n);a.target='_blank';a.rel='noopener';return a}
function shuffled(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function switchPage(id){for(const page of ['home','quiz','review'])$(page).hidden=id!==page;window.scrollTo(0,0)}
function sync(){
 const due=Object.entries(state.mistakes).filter(([,r])=>!r.mastered);
 $('progressText').textContent='完成 '+state.completed.length+' / '+chapters.length+' 站';$('bar').max=chapters.length;$('bar').value=state.completed.length;$('dueCount').textContent=due.length;
 for(const c of chapters){
  const p=$('pin'+c.id),seen=state.visited.includes(c.id),done=state.completed.includes(c.id),todo=due.some(([id])=>catalog.get(id).chapter===c.id);
  p.className='pin'+(seen?' seen':'')+(done?' done':'')+(todo?' due':'')+(station===c?' current':'');
  p.setAttribute('aria-pressed',String(station===c));p.setAttribute('aria-label','规则'+c.id+' '+c.name+'，'+(seen?'已探索':'未探索')+(done?'，已完成练习':'')+(todo?'，有题待复习':''));
 }
}
function drawStation(){
 const box=$('station');box.replaceChildren();
 if(!station){box.append(node('small','COURSE GUIDE','eyebrow'),node('h2','从球场选一站'),node('p','点地图上的规则编号，进入对应的球场情境。','anchor'));for(const c of chapters)box.append(node('p',String(c.id).padStart(2,'0')+'　'+c.name,'muted'));return}
 const c=station,bank=questions.filter(q=>q.chapter===c.id);
 box.append(node('span',String(c.id).padStart(2,'0'),'num'),node('h2',c.name),node('p',c.anchor,'anchor'),node('p',c.story));
 const d=node('details','');d.append(node('summary','查看完整依据与适用条件'));
 for(const q of bank)d.append(node('h3',q.rule),node('p',q.scenario),node('p',q.explanation,'muted'));
 d.append(source(c.id));box.append(node('p','相关条款　'+bank.map(q=>q.rule).join(' · '),'muted'),d);
 const row=node('div','','actions');row.append(button('入门 · 三选一',()=>start('basic',bank),'primary'),button('挑战 · 填编号',()=>start('challenge',bank)),button('反向回忆',()=>start('reverse',reverse.filter(q=>q.chapter===c.id))));
 const cases=challengeCases.filter(q=>q.chapter===c.id);if(cases.length)row.append(button('超高级案例',()=>start('case',cases)));
 box.append(row,button('收起详情',()=>{const old=station;station=null;drawStation();sync();$('pin'+old.id).focus()} ,'reset'));
}
for(const c of chapters){
 const p=button(String(c.id).padStart(2,'0'),()=>{station=c;if(!state.visited.includes(c.id)){state.visited.push(c.id);persist()}drawStation();sync();$('station').focus({preventScroll:true});if(matchMedia('(max-width:760px)').matches)$('station').scrollIntoView({block:'start'})},'pin');
 p.id='pin'+c.id;p.style.left=c.x+'%';p.style.top=c.y+'%';p.append(node('span',c.name,'tip'));$('land').append(p);
}
const modeNames={basic:'入门 · 三选一',challenge:'挑战 · 独立回忆',reverse:'编号 → 情境',case:'超高级案例',review:'错题复习'};
function home(){round=null;switchPage('home');drawStation();sync();if(station)$('pin'+station.id).focus({preventScroll:true})}
document.querySelectorAll('.back').forEach(b=>b.onclick=home);
function start(mode,list){round={mode,list:shuffled(list),index:0,score:0,phase:'answer',selected:'',wrong:false};switchPage('quiz');renderQuestion()}
function renderQuestion(){
 const r=round,q=r.list[r.index];r.phase='answer';r.selected='';r.wrong=false;$('mode').textContent=modeNames[r.mode];$('count').textContent=(r.index+1)+' / '+r.list.length;$('prompt').textContent=q.scenario;$('prompt').focus();$('feedback').replaceChildren();$('feedback').className='';$('err').textContent='';$('controls').replaceChildren();$('next').hidden=true;$('submit').hidden=false;$('submit').disabled=false;
 if(r.mode==='basic'||q.reverse){
  const choices=node('div','','answers');for(const opt of shuffled(q.options)){const b=button(opt,()=>{if(r.phase!=='answer')return;r.selected=opt;for(const sibling of choices.children)sibling.setAttribute('aria-pressed',String(sibling===b));$('err').textContent=''});b.setAttribute('aria-pressed','false');choices.append(b)}$('controls').append(choices);
 }else{
  const label=node('label',q.groups?'规则编号（多条用 + 分隔）':'填写具体规则编号');label.htmlFor='ruleInput';const input=node('input','');input.id='ruleInput';input.autocomplete='off';input.spellcheck=false;input.placeholder='输入规则编号';input.setAttribute('aria-describedby','err');input.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)submit()};input.oninput=()=>{if(matches(q,input.value)){input.removeAttribute('aria-invalid');$('err').textContent=''}};$('controls').append(label,input);
  if(q.groups){const label=node('label','你的判罚和处理（可在心中作答）');label.htmlFor='analysis';const memo=node('textarea','');memo.id='analysis';memo.rows=2;$('controls').append(label,memo)}
 }
}
const norm=v=>v.normalize('NFKC').toLowerCase().replace(/规则|rule|\s/g,'').replace(/[·•]/g,'.');
function matches(q,v){if(q.reverse)return v===q.answer;if(q.groups){const parts=[...new Set(norm(v).split(/[+,;、]+/).filter(Boolean))];return parts.length===q.groups.length&&q.groups.every(group=>group.some(a=>parts.includes(norm(a))))}return q.accepted.some(a=>norm(a)===norm(v))}
function record(q,answer,reason){
 const old=state.mistakes[q.id];if(round.wrong){if(reason==='处理分析有遗漏'&&old){old.reason='编号有误，处理分析也有遗漏';persist()}return}
 state.mistakes[q.id]={answer,reason,count:(old?.count||0)+1,mastered:false};round.wrong=true;persist();sync()
}
function explain(box,q){box.append(node('h3','规则 '+q.rule),node('p',q.explanation),node('p',q.memoryHint,'muted'),source(q.chapter));if(q.extra)box.append(node('span','　'),source(q.extra))}
function submit(){
 const r=round;if(!r||r.phase!=='answer')return;const q=r.list[r.index],input=$('ruleInput'),answer=input?input.value.trim():r.selected;
 if(!answer){$('err').textContent=input?'请先填写规则编号。':'请先选择一个答案。';input?.focus();return}
 const correct=matches(q,answer);if(!correct){record(q,answer+(q.groups&&$('analysis').value?'；'+$('analysis').value:''),'作答有误');if(q.groups){input.setAttribute('aria-invalid','true');$('err').textContent='编号尚未全部匹配，已收录错题。修改后再确认。';return}}
 r.phase='feedback';$('submit').hidden=true;$('err').textContent='';$('controls').querySelectorAll('input,button,textarea').forEach(x=>x.disabled=true);
 const fb=$('feedback');fb.className='feedback'+(correct?'':' bad');fb.append(node('strong',correct?'答对了':'已收录到错题集'));explain(fb,q);
 if(!correct&&input){input.disabled=false;input.setAttribute('aria-invalid','true');$('err').textContent='可以对照解析修改编号。首次答案已记入错题集。';}
 if(q.groups){const d=$('caseDialog');d.replaceChildren(node('h2','核对你的处理'),node('p',$('analysis').value||'请对照自己刚才在心中作出的判断。'));explain(d,q);const actions=node('div','','actions');for(const [caption,ok] of [['分析一致',true],['分析有遗漏',false]])actions.append(button(caption,()=>{if(!ok)record(q,answer+'；'+($('analysis').value||'心中作答'),'处理分析有遗漏');d.close();$('reopenCase')?.remove();finish(ok)},ok?'primary':''));d.append(actions);d.showModal();return}
 finish(correct)
}
function finish(correct){const r=round,q=r.list[r.index];if(correct&&!r.wrong){r.score++;if(state.mistakes[q.id]){state.mistakes[q.id].mastered=true;persist()}}r.phase='done';if(r.index===r.list.length-1&&['basic','challenge'].includes(r.mode)&&!state.completed.includes(q.chapter)){state.completed.push(q.chapter);persist()}sync();$('next').hidden=false;$('next').textContent=r.index===r.list.length-1?'查看结果':'下一题 →'}
$('next').onclick=()=>{const r=round;if(!r||r.phase!=='done')return;if(++r.index<r.list.length)return renderQuestion();r.phase='result';$('count').textContent='练习完成';$('prompt').textContent='首次答对 '+r.score+' / '+r.list.length+' 题';$('controls').replaceChildren();$('feedback').className='';$('feedback').replaceChildren(button('查看我的错题集',showReview));$('next').hidden=true};
function showReview(){
 switchPage('review');const box=$('records');box.replaceChildren();const entries=Object.entries(state.mistakes).sort((a,b)=>Number(a[1].mastered)-Number(b[1].mastered));const due=entries.filter(([,v])=>!v.mastered).map(([id])=>catalog.get(id));box.append(node('p','今天有 '+due.length+' 道题需要复习。'));
 if(due.length)box.append(button('开始复习',()=>start('review',due),'primary'));if(!entries.length)box.append(node('p','提交错误答案后，这里会自动保存原题、你的答案与规则依据。','muted'));
 for(const [id,record] of entries){const q=catalog.get(id),d=node('details','');d.append(node('summary',(record.mastered?'✓ 已掌握':'● 待复习')+' · '+q.scenario),node('p','原答案　'+record.answer),node('p',record.reason+' · 累计 '+record.count+' 次','muted'));explain(d,q);d.append(button('重练这道题',()=>start('review',[q])));box.append(d)}
}
$('submit').onclick=submit;$('reviewOpen').onclick=showReview;
const cd=node('dialog','');cd.id='caseDialog';cd.setAttribute('aria-label','案例解析与自评');cd.oncancel=e=>{e.preventDefault();cd.close();if(!$('reopenCase')){const reopen=button('继续核对分析',()=>cd.showModal());reopen.id='reopenCase';$('feedback').append(reopen)}};document.body.append(cd);
$('clear').onclick=()=>$('confirm').showModal();$('cancel').onclick=()=>$('confirm').close();$('erase').onclick=()=>{state=empty();station=null;persist();$('confirm').close();home()};
let wave;document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||b.disabled||b.classList.contains('pin')||matchMedia('(prefers-reduced-motion:reduce)').matches)return;wave?.remove();const w=node('span','','wave');wave=w;const rect=b.getBoundingClientRect();w.style.left=e.clientX-rect.left+'px';w.style.top=e.clientY-rect.top+'px';w.setAttribute('aria-hidden','true');b.append(w);setTimeout(()=>w.remove(),560)});document.addEventListener('pointermove',e=>{if(!wave?.isConnected||!e.buttons)return;const rect=wave.parentElement.getBoundingClientRect();wave.style.left=e.clientX-rect.left+'px';wave.style.top=e.clientY-rect.top+'px'});
drawStation();sync();

</script></body></html>
